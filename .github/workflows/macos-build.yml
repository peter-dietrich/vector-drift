name: macOS Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build unsigned app
        run: |
          xcodebuild -project VectorDrift.xcodeproj -scheme VectorDrift -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
