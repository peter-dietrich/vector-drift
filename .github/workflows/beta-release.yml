name: Vector Drift beta signing and controlled prerelease

on:
  # Single-run publication branch. This trigger is intentionally NOT merged
  # to main; all normal beta builds remain manually dispatched.
  push:
    branches:
      - ci/publish-v0.14.2-beta.4
    paths:
      - .github/workflows/beta-release.yml
  workflow_dispatch:
    inputs:
      beta_version:
        description: "Pilot version, e.g. v0.14.2-beta.1"
        required: true
        default: "v0.14.2-beta.1"
        type: string
      publish_prerelease:
        description: "Publish a PUBLIC GitHub prerelease after notarization (default NO)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sign-notarize-pilot:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and build release candidate
        env:
          BETA_VERSION: ${{ github.event_name == 'push' && 'v0.14.2-beta.4' || inputs.beta_version }}
        run: |
          set -euo pipefail
          if [[ ! "$BETA_VERSION" =~ ^v0\.14\.2-beta\.([1-9][0-9]*)$ ]]; then
            echo "::error::Only v0.14.2-beta.N is permitted for this pilot."
            exit 1
          fi
          BUILD="${BASH_REMATCH[1]}"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF_NAME" == "ci/publish-v0.14.2-beta.4" ]]
            [[ "$(git rev-parse HEAD^)" == "ee62db749c0d638b7223b9edbdd8d73a842b04bb" ]] || {
              echo "::error::Unexpected parent: aborting one-time beta4 publication."
              exit 1
            }
          fi
          xcodebuild -project VectorDrift.xcodeproj -scheme VectorDrift -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived" -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_CFBundleShortVersionString=0.14.2 \
            INFOPLIST_KEY_CFBundleVersion="$BUILD" build
          APP="$RUNNER_TEMP/derived/Build/Products/Release/VectorDrift.app"
          test -d "$APP"
          # This project uses GENERATE_INFOPLIST_FILE=YES. Xcode 16.4 does not
          # automatically add the version keys from the INFOPLIST_KEY_* overrides,
          # so explicitly write both values BEFORE Developer ID signing.
          PLIST="$APP/Contents/Info.plist"
          if ! /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.14.2" "$PLIST" 2>/dev/null; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 0.14.2" "$PLIST"
          fi
          if ! /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST" 2>/dev/null; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "$PLIST"
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "0.14.2"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$BUILD"
          echo "Beta bundle version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST") ($BUILD)"

      - name: Sign with Developer ID and notarize
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in APPLE_DEVELOPER_ID_CERT_BASE64 APPLE_DEVELOPER_ID_CERT_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $variable"
              exit 1
            fi
          done

          KEYCHAIN="$RUNNER_TEMP/pilot.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          trap 'security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/developer-id.p12"' EXIT
          printf "%s" "$APPLE_DEVELOPER_ID_CERT_BASE64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          APP="$RUNNER_TEMP/derived/Build/Products/Release/VectorDrift.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Contents/Info.plist")
          if [[ "$BUNDLE_ID" != "io.vectordrift.prototype" ]]; then
            echo "::error::Unexpected app bundle ID: $BUNDLE_ID"
            exit 1
          fi
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          TEAM_SIGNED=$(codesign --display --verbose=4 "$APP" 2>&1 | sed -n "s/^TeamIdentifier=//p")
          if [[ "$TEAM_SIGNED" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::Unexpected signing team: $TEAM_SIGNED"
            exit 1
          fi

          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarization.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait \
            --output-format json > "$RUNNER_TEMP/notary-result.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); s=r.get("status"); print("Apple notary status:",s); sys.exit(0 if s=="Accepted" else 1)' \
            "$RUNNER_TEMP/notary-result.json"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/VectorDrift-macOS.zip"
          (cd dist && shasum -a 256 VectorDrift-macOS.zip > VectorDrift-macOS.zip.sha256)

      - name: Upload signed beta test artifact
        uses: actions/upload-artifact@v4
        with:
          name: VectorDrift-beta-signed-artifact
          path: |
            dist/VectorDrift-macOS.zip
            dist/VectorDrift-macOS.zip.sha256
          retention-days: 7

      - name: Publish PUBLIC GitHub beta release (explicit opt-in only)
        if: ${{ github.event_name == 'push' || inputs.publish_prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_VERSION: ${{ github.event_name == 'push' && 'v0.14.2-beta.4' || inputs.beta_version }}
        run: |
          set -euo pipefail
          gh release create "$BETA_VERSION" \
            "dist/VectorDrift-macOS.zip" \
            "dist/VectorDrift-macOS.zip.sha256" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Vector Drift $BETA_VERSION (Public Test)" \
            --notes "Signed and notarized test build for Fun City's beta install/update workflow. Public prerelease; not a production launch."
